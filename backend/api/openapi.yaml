openapi: 3.0.3
info:
  title: OralHistory 口述历史采集工具 API
  description: 口述历史采集工具后端接口文档（Go 1.22 + Gin + GORM）
  version: 1.0.0
servers:
  - url: http://localhost:9180/api/v1
paths:
  /auth/register:
    post:
      summary: 用户注册
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                display_name: { type: string }
                email: { type: string }
                role: { type: string, enum: [admin, interviewer, archivist] }
      responses:
        '200': { description: 注册成功 }
  /auth/login:
    post:
      summary: 用户登录
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功，返回 token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
  /auth/me:
    get:
      summary: 当前用户信息
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 用户信息 }
  /projects:
    get:
      summary: 项目列表（可按 status 筛选）
      tags: [projects]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
    post:
      summary: 创建采访项目
      tags: [projects]
      security: [{ BearerAuth: [] }]
  /projects/{id}:
    get: { summary: 项目详情, tags: [projects], security: [{ BearerAuth: [] }] }
    put: { summary: 更新项目, tags: [projects], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除项目, tags: [projects], security: [{ BearerAuth: [] }] }
  /projects/{id}/status:
    put:
      summary: 项目状态流转
      tags: [projects]
      security: [{ BearerAuth: [] }]
  /projects/{projectId}/questions:
    get: { summary: 项目问题列表, tags: [questions], security: [{ BearerAuth: [] }] }
    post: { summary: 添加问题, tags: [questions], security: [{ BearerAuth: [] }] }
  /questions/{id}:
    put: { summary: 更新问题, tags: [questions], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除问题, tags: [questions], security: [{ BearerAuth: [] }] }
  /recordings:
    get:
      summary: 录音列表（project_id 或 question_id）
      tags: [recordings]
      security: [{ BearerAuth: [] }]
    post: { summary: 创建录音记录, tags: [recordings], security: [{ BearerAuth: [] }] }
  /recordings/{id}:
    get: { summary: 录音详情, tags: [recordings], security: [{ BearerAuth: [] }] }
    put: { summary: 更新录音, tags: [recordings], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除录音, tags: [recordings], security: [{ BearerAuth: [] }] }
  /recordings/{id}/audio:
    post: { summary: 上传录音文件(multipart), tags: [recordings], security: [{ BearerAuth: [] }] }
    get: { summary: 播放录音音频流, tags: [recordings], security: [{ BearerAuth: [] }] }
  /timeline-markers:
    get:
      summary: 时间轴节点列表（project_id 或 recording_id）
      tags: [timeline]
      security: [{ BearerAuth: [] }]
    post: { summary: 标注时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
  /timeline-markers/{id}:
    put: { summary: 更新时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
  /transcripts:
    get:
      summary: 转写稿列表（project_id / recording_id / status 过滤）
      tags: [transcripts]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: project_id, in: query, schema: { type: integer } }
        - { name: recording_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, approved, rejected] } }
    post:
      summary: 为已就绪录音创建转写草稿（采访员；已通过内容再次修改时生成新版本并保留旧版）
      tags: [transcripts]
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [recording_id, project_id]
              properties:
                recording_id: { type: integer }
                project_id: { type: integer }
      responses:
        '200': { description: 草稿创建成功 }
        '403': { description: 跨项目写入或无权限 }
        '409': { description: 录音未就绪 / 项目已归档 / 已有进行中的转写稿 }
  /transcripts/search:
    get:
      summary: 检索已通过转写全文（仅每个录音最新已通过版本）
      tags: [transcripts]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: project_id, in: query, schema: { type: integer } }
  /transcripts/{id}:
    get: { summary: 转写稿详情（含分段）, tags: [transcripts], security: [{ BearerAuth: [] }] }
  /transcripts/{id}/segments:
    put:
      summary: 批量保存草稿分段（采访员，整体替换；按时间轴记录说话人与内容）
      tags: [transcripts]
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                segments:
                  type: array
                  items:
                    type: object
                    required: [speaker, content]
                    properties:
                      start_second: { type: integer }
                      end_second: { type: integer }
                      speaker: { type: string }
                      content: { type: string }
      responses:
        '200': { description: 保存成功 }
        '409': { description: 状态不允许编辑（并发修改/已提交） }
  /transcripts/{id}/submit:
    post: { summary: 提交审核（采访员）, tags: [transcripts], security: [{ BearerAuth: [] }] }
  /transcripts/{id}/segments/{segmentId}/confirm:
    post: { summary: 逐段确认（档案员）, tags: [transcripts], security: [{ BearerAuth: [] }] }
  /transcripts/{id}/approve:
    post:
      summary: 整篇通过（档案员，需全部分段已确认）
      tags: [transcripts]
      security: [{ BearerAuth: [] }]
  /transcripts/{id}/reject:
    post:
      summary: 整篇退回（档案员，必须写明问题）
      tags: [transcripts]
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 512 }
  /transcripts/{id}/export:
    get:
      summary: 导出已通过转写稿全文（text/plain）
      tags: [transcripts]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 纯文本全文 }
        '409': { description: 未审核通过不能导出 }
  /audit-logs:
    get:
      summary: 审计日志列表（仅管理员）
      tags: [audit]
      security: [{ BearerAuth: [] }]
  /users:
    get: { summary: 用户列表（仅管理员）, tags: [users], security: [{ BearerAuth: [] }] }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
